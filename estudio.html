<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio</title>
<meta name="theme-color" content="#F26B1D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23F26B1D'/%3E%3Cpath d='M256 160C215 135 160 130 110 145V355C160 340 215 345 256 370C297 345 352 340 402 355V145C352 130 297 135 256 160Z' fill='%23fff'/%3E%3Cpath d='M256 160V370' stroke='%23F26B1D' stroke-width='10'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f3;--sf:#fff;--tx:#1d1b19;--mu:#76706a;--ln:#e6e2dd;--or:#F26B1D;--ord:#c9510b;--ok:#2f9e5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151413;--sf:#201e1c;--tx:#f3f0ec;--mu:#a09a93;--ln:#33302d;--or:#ff8a45;--ord:#ff8a45;--ok:#4cc27f}}
:root[data-theme="dark"]{--bg:#151413;--sf:#201e1c;--tx:#f3f0ec;--mu:#a09a93;--ln:#33302d;--or:#ff8a45;--ord:#ff8a45;--ok:#4cc27f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Nunito","Segoe UI",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 90px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header img{width:44px;height:44px;border-radius:12px}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.subj{cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.subj:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-weight:800;font-size:18px}
.days{font-weight:700;font-size:14px;white-space:nowrap}
.days.soon{color:var(--ord)}.days.past{color:var(--mu)}
.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--or);border-radius:99px;transition:width .25s}
.bar i.full{background:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-top:6px}
form.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0 0 14px}
form.add .full{grid-column:1/-1}
input[type=text],input[type=date]{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.btn{background:var(--or);color:#fff;font-weight:800;padding:11px 16px}
.ghost{background:none;color:var(--mu);padding:8px 10px}
.back{color:var(--ord);font-weight:700;padding:6px 0;margin-bottom:6px;background:none}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:800}
.chk.on{background:var(--ok);border-color:var(--ok)}
.tname.done{text-decoration:line-through;color:var(--mu)}
.pct{display:flex;align-items:center;gap:10px;margin-top:8px;grid-column:2/4}
.pct input{flex:1;accent-color:#F26B1D;min-width:0}
.pct b{width:42px;text-align:right;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.edit{display:flex;gap:8px;align-items:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var KEY="estudio:v1",S=[],cur=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){S=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function tp(t){return t.done?100:t.pct}
function prog(s){return s.topics.length?Math.round(s.topics.reduce(function(a,t){return a+tp(t)},0)/s.topics.length):0}
function daysTo(d){var a=new Date();a.setHours(0,0,0,0);var b=new Date(d+"T00:00:00");return Math.round((b-a)/864e5)}
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}
function dl(d){var n=daysTo(d);if(n<0)return['Examen pasado','past'];if(n===0)return['¡Hoy!','soon'];if(n===1)return['Mañana','soon'];return['Faltan '+n+' días',n<=7?'soon':'']}
var ICON="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23F26B1D'/%3E%3Cpath d='M256 160C215 135 160 130 110 145V355C160 340 215 345 256 370C297 345 352 340 402 355V145C352 130 297 135 256 160Z' fill='%23fff'/%3E%3Cpath d='M256 160V370' stroke='%23F26B1D' stroke-width='10'/%3E%3C/svg%3E";
function bar(p){return'<div class="bar"><i class="'+(p===100?'full':'')+'" style="width:'+p+'%"></i></div>'}
function home(){
  var list=S.slice().sort(function(a,b){return a.date<b.date?-1:1});
  var h='<header><img src="'+ICON+'" alt=""><div><h1>Estudio</h1><div class="sub">'+(S.length?S.length+' asignatura'+(S.length>1?'s':''):'Tus exámenes, bajo control')+'</div></div></header>';
  h+='<form class="add" id="fa"><input class="full" type="text" id="n" placeholder="Nueva asignatura" required maxlength="60"><input type="date" id="d" required aria-label="Fecha del examen"><button class="btn" type="submit">Añadir</button></form>';
  if(!list.length)h+='<div class="empty">Añade tu primera asignatura y la fecha del examen.</div>';
  list.forEach(function(s){var p=prog(s),x=dl(s.date);
    h+='<button class="card subj" data-id="'+s.id+'"><div class="row"><span class="name">'+esc(s.name)+'</span><span class="days '+x[1]+'">'+x[0]+'</span></div><div class="meta" style="margin:2px 0 0"><span>'+fmt(s.date)+'</span><span>'+p+'%</span></div>'+bar(p)+'</button>'});
  return h}
function detail(s){
  var p=prog(s),x=dl(s.date),done=s.topics.filter(function(t){return t.done}).length;
  var h='<button class="back" id="bk">‹ Asignaturas</button>';
  h+='<div class="card"><div class="row"><span class="name">'+esc(s.name)+'</span><span class="days '+x[1]+'">'+x[0]+'</span></div>';
  h+='<div class="edit" style="margin:8px 0 0"><input type="date" id="ed" value="'+s.date+'" aria-label="Fecha del examen"><button class="ghost" id="del">Eliminar</button></div>';
  h+=bar(p)+'<div class="meta"><span>'+done+' de '+s.topics.length+' temas completados</span><span>'+p+'%</span></div></div>';
  h+='<form class="add" id="ft"><input type="text" id="tn" placeholder="Añadir tema" required maxlength="80"><button class="btn" type="submit">Añadir</button></form>';
  if(!s.topics.length)h+='<div class="empty">Añade los temas que entran en el examen.</div>';
  s.topics.forEach(function(t){
    h+='<div class="card topic"><button class="chk '+(t.done?'on':'')+'" data-t="'+t.id+'" aria-label="Marcar tema como completado">'+(t.done?'✓':'')+'</button><span class="tname '+(t.done?'done':'')+'">'+esc(t.name)+'</span><button class="ghost" data-x="'+t.id+'" aria-label="Eliminar tema">✕</button>';
    h+='<div class="pct"><input type="range" min="0" max="100" step="5" value="'+tp(t)+'" data-r="'+t.id+'" aria-label="Porcentaje que sabes"><b>'+tp(t)+'%</b></div></div>'});
  return h}
function get(){return S.filter(function(s){return s.id===cur})[0]}
function render(){
  var app=document.getElementById("app"),s=cur&&get();
  if(cur&&!s)cur=null;
  app.innerHTML=s?detail(s):home();
  var $=function(i){return document.getElementById(i)};
  if(!s){
    $("fa").onsubmit=function(e){e.preventDefault();S.push({id:uid(),name:$("n").value.trim(),date:$("d").value,topics:[]});save();render()};
    app.querySelectorAll(".subj").forEach(function(b){b.onclick=function(){cur=b.dataset.id;render();window.scrollTo(0,0)}});
  }else{
    $("bk").onclick=function(){cur=null;render()};
    $("del").onclick=function(){if(confirm("¿Eliminar "+s.name+" y todos sus temas?")){S=S.filter(function(x){return x.id!==s.id});cur=null;save();render()}};
    $("ed").onchange=function(){if(this.value){s.date=this.value;save();render()}};
    $("ft").onsubmit=function(e){e.preventDefault();s.topics.push({id:uid(),name:$("tn").value.trim(),pct:0,done:false});save();render()};
    app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){var t=s.topics.filter(function(t){return t.id===b.dataset.t})[0];t.done=!t.done;if(t.done)t.pct=100;else if(t.pct===100)t.pct=90;save();render()}});
    app.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){s.topics=s.topics.filter(function(t){return t.id!==b.dataset.x});save();render()}});
    app.querySelectorAll("[data-r]").forEach(function(r){
      r.oninput=function(){r.nextSibling.textContent=r.value+"%"};
      r.onchange=function(){var t=s.topics.filter(function(t){return t.id===r.dataset.r})[0];t.pct=+r.value;t.done=false;save();render()}});
  }}
render();
</script>
</body>
</html>
